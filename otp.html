<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify number | Maya</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="back-button" type="button" aria-label="Back"></button>
        <button class="help-button" type="button" aria-label="Help">
          <span class="help-icon">?</span>
          <span>Help</span>
        </button>
      </header>

      <main class="main">
        <div class="auth-wrap">
          <section class="panel">
            <p class="eyebrow">Step 3 of 4</p>
            <h2 class="auth-heading">Verify your number</h2>
            <p class="auth-copy">Enter the one-time password sent to your mobile number.</p>
            <form id="otpForm" novalidate>
              <div class="otp-boxes" role="group" aria-label="One-time password">
                <input id="otp-1" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" pattern="[0-9]" aria-label="Digit 1" required>
                <input id="otp-2" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 2" required>
                <input id="otp-3" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 3" required>
                <input id="otp-4" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 4" required>
              </div>
              <p id="otpError" class="form-error" role="alert" hidden>Enter all 4 digits to continue.</p>
              <button class="primary" type="submit">Continue</button>
            </form>
            <button class="auth-link auth-link-button" id="resendOtp" type="button">Resend code</button>
          </section>
        </div>
      </main>
      <div class="copyright">maya © 2026</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
