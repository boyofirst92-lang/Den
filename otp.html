<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify number | Maya demo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="back-button" type="button" aria-label="Back"></button>
        <button class="help-button" type="button" aria-label="Help">
          <span class="help-icon">?</span>
          <span>Help</span>
        </button>
      </header>

      <main class="main">
        <div class="auth-wrap">
          <section class="panel">
            <p class="eyebrow">Step 3 of 4</p>
            <h2 class="auth-heading">Verify your number</h2>
            <p class="auth-copy">We sent a one-time password to your mobile number.</p>
            <form id="otpForm">
              <div class="otp-boxes">
                <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 1">
                <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 2">
                <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 3">
                <input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 4">
              </div>
              <button class="primary" type="submit">Continue</button>
            </form>
            <a class="auth-link" href="details.html">Resend code</a>
          </section>
        </div>
      </main>
      <p class="legal">Demo experience only. No application, credit check, or payment is submitted.</p>
      <div class="copyright">maya © 2026</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
