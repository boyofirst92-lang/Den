<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify number | Maya</title><style>body{margin:0;font:16px Arial;color:#073b2c;background:#fff}.page{max-width:470px;margin:120px auto;padding:30px;border:1px solid #dcebe3;border-radius:22px;box-shadow:0 20px 60px #00462f1f}.otp{display:flex;gap:8px;margin:25px 0}.otp input{width:46px;height:54px;border:1px solid #c8dcd3;border-radius:9px;text-align:center;font-size:24px}.button{width:100%;padding:15px;border:0;border-radius:10px;background:#c8f169;color:#073b2c;font-weight:700}.error{color:#b42318}</style></head><body><main class="page"><h1>Verify your number</h1><p>Enter the one-time password sent to your mobile number.</p><form id="otpForm"><div class="otp">${''}<input maxlength="1" inputmode="numeric" required><input maxlength="1" inputmode="numeric" required><input maxlength="1" inputmode="numeric" required><input maxlength="1" inputmode="numeric" required><input maxlength="1" inputmode="numeric" required><input maxlength="1" inputmode="numeric" required></div><p id="error" class="error" hidden>Enter all 6 digits to continue.</p><button class="button">Continue</button></form><button id="resend" class="button" style="margin-top:12px;background:transparent;color:#00b968">Resend code</button></main><script>const fields=[...document.querySelectorAll('.otp input')],error=document.querySelector('#error');fields.forEach((f,i)=>{f.oninput=()=>{f.value=f.value.replace(/\D/g,'').slice(-1);if(f.value&&fields[i+1])fields[i+1].focus()};f.onkeydown=e=>{if(e.key==='Backspace'&&!f.value&&fields[i-1])fields[i-1].focus()}});document.querySelector('#otpForm').onsubmit=e=>{e.preventDefault();if(fields.some(f=>!f.value)){error.hidden=false;return}location.href='success.html'};document.querySelector('#resend').onclick=()=>{fields.forEach(f=>f.value='');error.hidden=true;fields[0].focus()}</script></body></html>
