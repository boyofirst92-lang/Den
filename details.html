<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your details | Maya demo</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

      :root {
        --maya-green: #00b968;
        --maya-deep: #006f4d;
        --maya-ink: #073b2c;
        --maya-mint: #e7f8ef;
        --maya-lime: #c8f169;
        --paper: #f7fbf8;
        --line: #dcebe3;
        --muted: #688077;
        --white: #ffffff;
        --shadow: 0 20px 60px rgba(0, 70, 47, .12);
        --dark: #000000;
        --soft-bg: #ffffff;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #ffffff; color: var(--maya-ink); font-family: 'DM Sans', sans-serif; line-height: 1.5; }
      body { min-height: 100vh; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      .page-shell { min-height: 100vh; display: flex; flex-direction: column; background: #ffffff; }
      .topbar { position: relative; display: flex; align-items: flex-start; justify-content: space-between; height: 335px; min-height: 335px; padding: 20px 32px 0; background: #ffffff; }
      .topbar::after { content: 'maya'; position: absolute; top: 222px; left: 50%; transform: translateX(-50%); color: #00a85a; font-family: 'Space Grotesk', sans-serif; font-size: clamp(4rem, 10vw, 5.6rem); letter-spacing: -0.08em; font-weight: 700; }
      .back-button { position: relative; width: 50px; height: 50px; border: 0; background: transparent; padding: 0; margin: 5px 0 0; }
      .back-button::before { content: ''; position: absolute; left: 4px; top: 22px; width: 43px; height: 5px; background: #111111; border-radius: 3px; }
      .back-button::after { content: ''; position: absolute; left: 5px; top: 12px; width: 20px; height: 20px; border-left: 5px solid #111111; border-bottom: 5px solid #111111; transform: rotate(45deg); }
      .help-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-width: 126px; height: 64px; padding: 0 17px; border: 0; border-radius: 999px; background: #000000; color: #ffffff; font-weight: 700; }
      .help-icon { width: 27px; height: 27px; display: grid; place-items: center; border: 2px solid #ffffff; border-radius: 50%; background: #000000; color: #ffffff; font-size: 1.05rem; font-weight: 700; }
      .main { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 72px; flex: 1; }
      .eyebrow { margin: 0 0 12px; color: var(--maya-green); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1, h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; letter-spacing: -1.7px; line-height: 1.08; }
      h1 { font-size: clamp(30px, 4vw, 48px); max-width: 650px; }
      h2 { font-size: 24px; }
      .intro { max-width: 680px; margin: 17px 0 35px; color: var(--muted); font-size: 15px; }
      .grid { display: grid; grid-template-columns: 1.13fr .87fr; gap: 22px; align-items: start; }
      .panel { padding: clamp(24px, 4vw, 38px); background: var(--white); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
      .panel h2 { margin-bottom: 27px; }
      .amount { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      .amount strong { color: var(--maya-green); font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 6vw, 54px); letter-spacing: -2px; }
      .amount span { color: var(--muted); font-size: 13px; }
      input[type=range] { width: 100%; margin: 22px 0 5px; accent-color: var(--maya-green); }
      .range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
      .term-title { display: flex; justify-content: space-between; margin: 35px 0 12px; font-weight: 700; }
      .term-title span { color: var(--maya-green); }
      .term-options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
      .term-option { padding: 11px 4px; color: var(--maya-deep); background: var(--white); border: 1px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 700; }
      .term-option.active, .term-option:hover { color: var(--white); background: var(--maya-green); border-color: var(--maya-green); }
      .estimate { background: var(--maya-ink); color: var(--white); border: 0; }
      .estimate h2 { color: var(--white); }
      .estimate-label { margin: 0; color: #a4c8b8; font-size: 13px; }
      .monthly { margin: 6px 0 25px; color: var(--maya-lime); font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -2px; }
      .breakdown { padding-top: 18px; border-top: 1px solid rgba(255,255,255,.18); }
      .row { display: flex; justify-content: space-between; gap: 20px; margin: 10px 0; color: #c1ded2; font-size: 14px; }
      .row strong { color: var(--white); }
      .primary, .secondary { width: 100%; padding: 15px 20px; border-radius: 10px; font-weight: 700; }
      .primary { color: var(--maya-ink); background: var(--maya-lime); border: 0; }
      .secondary { color: var(--maya-deep); background: var(--white); border: 1px solid var(--line); }
      .estimate .primary { margin-top: 27px; }
      .auth-wrap { width: min(470px, 100%); margin: 0 auto; }
      .auth-wrap .panel { padding: clamp(25px, 6vw, 44px); }
      .auth-heading { margin-bottom: 8px; }
      .auth-copy { margin: 0 0 28px; color: var(--muted); }
      .field { display: block; margin: 18px 0; color: var(--maya-ink); font-size: 13px; font-weight: 700; }
      .field input, .field select { width: 100%; margin-top: 8px; padding: 14px 15px; color: var(--maya-ink); background: var(--white); border: 1px solid #c8dcd3; border-radius: 9px; outline: 0; }
      .details-wrap { width: min(540px, 100%); }
      .auth-link { display: block; margin-top: 18px; color: var(--maya-green); text-align: center; font-size: 13px; font-weight: 700; text-decoration: none; }
      .otp-boxes { display: flex; justify-content: space-between; gap: 8px; margin: 25px 0; }
      .otp-boxes input { width: 46px; height: 54px; border: 1px solid #c8dcd3; border-radius: 9px; color: var(--maya-ink); font-size: 24px; font-weight: 700; text-align: center; }
      .form-error { margin: -12px 0 16px; color: #b42318; font-size: 13px; }
      .auth-link-button { width: 100%; padding: 0; border: 0; background: transparent; }
      .success-mark { width: 74px; height: 74px; display: grid; place-items: center; margin: 0 auto 22px; color: var(--white); background: var(--maya-green); border-radius: 50%; font-size: 36px; }
      .success-panel { text-align: center; }
      .success-panel h1 { margin: 0 auto 12px; }
      .success-panel .intro { margin: 0 auto 28px; font-size: 15px; }
      .summary { padding: 17px 18px; margin: 0 0 25px; background: var(--maya-mint); border-radius: 10px; text-align: left; }
      .summary .row { color: var(--muted); margin: 6px 0; }
      .summary .row strong { color: var(--maya-ink); }
      .legal { width: min(1080px, calc(100% - 40px)); margin: 0 auto 20px; color: var(--muted); font-size: 11px; text-align: center; }
      .copyright { padding: 18px 0 22px; text-align: center; color: rgba(18, 18, 18, .8); font-size: .9rem; font-weight: 600; letter-spacing: .02em; text-transform: lowercase; }
      .login-main { flex: 1; width: min(100%, 520px); margin: 0 auto; padding: 0 22px 12px; display: flex; flex-direction: column; align-items: center; }
      .login-form { width: min(100%, 430px); display: flex; flex-direction: column; gap: 20px; }
      .login-input, .login-password { width: 100%; min-height: 72px; background: rgba(238, 240, 240, .92); border: 1px solid rgba(0, 0, 0, .02); border-radius: 16px; display: flex; align-items: center; }
      .login-phone-prefix { width: 70px; color: #0d1a18; font-size: 1rem; font-weight: 500; }
      .login-input input, .login-password input { width: 100%; border: 0; background: transparent; outline: 0; color: #0d1a18; font-size: 1.1rem; }
      .login-input input::placeholder { color: #7d8d8a; }
      .login-password { position: relative; padding-right: 12px; }
      .login-password .field-label { position: absolute; top: 11px; left: 18px; font-size: .9rem; color: #0d1a18; font-weight: 500; }
      .login-password input { margin-top: 17px; }
      .eye-icon { position: relative; width: 38px; height: 26px; margin-left: 12px; }
      .forgot-link { text-align: center; margin-top: 2px; }
      .forgot-link a { color: var(--maya-green); text-decoration: none; font-size: 1rem; font-weight: 500; }
      .login-button { width: 100%; height: 60px; margin-top: 42px; border: 0; border-radius: 16px; background: rgba(161, 230, 179, .9); color: #0a4a32; font-size: 1.25rem; font-weight: 700; }

      @media (max-width: 720px) {
        .topbar { height: 300px; min-height: 300px; padding: 12px 20px 0; }
        .topbar::after { top: 200px; }
        .grid { grid-template-columns: 1fr; }
        .estimate { order: -1; }
      }

      @media (max-width: 420px) {
        .topbar { padding-left: 12px; padding-right: 12px; }
        .help-button { min-width: 126px; height: 56px; }
        .main { width: min(calc(100% - 32px), 1080px); }
        .otp-boxes { gap: 6px; }
      }

      html, body, button, input, select {
        font-family: 'DM Sans', sans-serif;
      }

      h1, h2, .amount strong, .monthly, .maya-logo {
        font-family: 'DM Sans', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="back-button" type="button" aria-label="Back"></button>
        <button class="help-button" type="button" aria-label="Help">
          <span class="help-icon">?</span>
          <span>Help</span>
        </button>
      </header>

      <main class="main">
        <div class="auth-wrap details-wrap">
          <section class="panel">
            <p class="eyebrow">Step 2 of 4</p>
            <h2 class="auth-heading">Tell us about yourself</h2>
            <p class="auth-copy">Share a few details so we can tailor your loan application.</p>
            <form id="detailsForm">
              <label class="field">Full name<input id="fullName" type="text" placeholder="Juan Dela Cruz" autocomplete="name" required></label>
              <label class="field">Mobile number<input id="detailsPhone" type="tel" placeholder="09XX XXX XXXX" autocomplete="tel" inputmode="tel" required></label>
              <label class="field">Monthly income<input id="monthlyIncome" type="number" placeholder="50,000" min="1" step="1" inputmode="decimal" required></label>
              <label class="field">What will you use the loan for?<select id="loanPurpose" required><option value="" disabled selected>Select a purpose</option><option>Home improvement</option><option>Medical expenses</option><option>Education</option><option>Business</option><option>Other</option></select></label>
              <button class="primary" type="submit">Continue to login</button>
            </form>
            <a class="auth-link" href="application.html">Back to loan estimate</a>
          </section>
        </div>
      </main>
      <p class="legal">Demo experience only. No application, credit check, or payment is submitted.</p>
      <div class="copyright">maya © 2026</div>
    </div>
    <script>
      const loanState = {
        amount: Number(localStorage.getItem('mayaLoanAmount')) || 100000,
        months: Number(localStorage.getItem('mayaLoanMonths')) || 24,
        rate: 0.04
      };

      function peso(value) {
        return `P${Math.round(value).toLocaleString('en-PH')}`;
      }

      function calculateLoan() {
        const interest = loanState.amount * loanState.rate * (loanState.months / 12);
        const total = loanState.amount + interest;
        return { interest, total, monthly: total / loanState.months };
      }

      function renderLoan() {
        const amountInput = document.querySelector('#loanAmount');
        if (!amountInput) return;
        loanState.amount = Number(amountInput.value);
        const amountLabel = document.querySelector('#amountLabel');
        const termLabel = document.querySelector('#termLabel');
        const result = calculateLoan();
        amountLabel.textContent = peso(loanState.amount);
        termLabel.textContent = `${loanState.months} months`;
        document.querySelector('#monthlyPayment').textContent = `${peso(result.monthly)} / mo`;
        document.querySelector('#interestValue').textContent = peso(result.interest);
        document.querySelector('#totalValue').textContent = peso(result.total);
      }

      function initApplication() {
        const amountInput = document.querySelector('#loanAmount');
        if (!amountInput) return;
        amountInput.value = loanState.amount;
        document.querySelectorAll('.term-option').forEach((button) => {
          button.classList.toggle('active', Number(button.dataset.months) === loanState.months);
          button.addEventListener('click', () => {
            loanState.months = Number(button.dataset.months);
            document.querySelectorAll('.term-option').forEach((item) => item.classList.remove('active'));
            button.classList.add('active');
            renderLoan();
          });
        });
        amountInput.addEventListener('input', renderLoan);
        document.querySelector('#continueButton').addEventListener('click', () => {
          localStorage.setItem('mayaLoanAmount', loanState.amount);
          localStorage.setItem('mayaLoanMonths', loanState.months);
          window.location.href = 'details.html';
        });
        renderLoan();
      }

      function initDetails() {
        const form = document.querySelector('#detailsForm');
        if (!form) return;
        const phone = document.querySelector('#detailsPhone');
        const savedPhone = localStorage.getItem('mayaPhone');
        if (savedPhone) phone.value = savedPhone;
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          localStorage.setItem('mayaName', document.querySelector('#fullName').value.trim());
          localStorage.setItem('mayaPhone', phone.value.trim());
          localStorage.setItem('mayaIncome', document.querySelector('#monthlyIncome').value);
          localStorage.setItem('mayaLoanPurpose', document.querySelector('#loanPurpose').value);
          window.location.href = 'login.html';
        });
      }

      function initLogin() {
        const form = document.querySelector('#loginForm');
        if (!form) return;
        const phone = document.querySelector('#loginPhone');
        phone.value = localStorage.getItem('mayaPhone') || '';
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          if (!form.reportValidity()) return;
          localStorage.setItem('mayaPhone', phone.value.trim());
          window.location.href = 'otp.html';
        });
      }

      function initOtp() {
        const form = document.querySelector('#otpForm');
        if (!form) return;
        const fields = [...form.querySelectorAll('.otp-boxes input')];
        const error = document.querySelector('#otpError');

        fields.forEach((field, index) => {
          field.addEventListener('input', () => {
            field.value = field.value.replace(/\D/g, '').slice(-1);
            error.hidden = true;
            if (field.value && fields[index + 1]) fields[index + 1].focus();
          });
          field.addEventListener('keydown', (event) => {
            if (event.key === 'Backspace' && !field.value && fields[index - 1]) fields[index - 1].focus();
          });
          field.addEventListener('paste', (event) => {
            const code = (event.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, fields.length);
            if (!code) return;
            event.preventDefault();
            code.split('').forEach((digit, digitIndex) => { fields[digitIndex].value = digit; });
            fields[Math.min(code.length, fields.length) - 1].focus();
          });
        });

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const code = fields.map((field) => field.value).join('');
          if (code.length !== fields.length) {
            error.hidden = false;
            fields.find((field) => !field.value)?.focus();
            return;
          }
          window.location.href = 'success.html';
        });

        document.querySelector('#resendOtp')?.addEventListener('click', () => {
          fields.forEach((field) => { field.value = ''; });
          error.hidden = true;
          fields[0].focus();
        });
      }

      function initSuccess() {
        const amount = Number(localStorage.getItem('mayaLoanAmount')) || loanState.amount;
        const months = Number(localStorage.getItem('mayaLoanMonths')) || loanState.months;
        loanState.amount = amount;
        loanState.months = months;
        const result = calculateLoan();
        const amountElement = document.querySelector('#successAmount');
        if (!amountElement) return;
        amountElement.textContent = peso(amount);
        document.querySelector('#successMonthly').textContent = `${peso(result.monthly)} / mo`;
        document.querySelector('#successTerm').textContent = `${months} months`;
      }

      function applySharedPolish() {
        document.querySelectorAll('.legal').forEach((element) => element.remove());
        document.querySelectorAll('title').forEach((element) => {
          element.textContent = element.textContent.replace(/\s+demo\b/gi, '');
        });
        document.querySelectorAll('.copyright').forEach((element) => {
          element.textContent = '© 2026 Maya — All rights reserved.';
        });
      }

      initApplication();
      initDetails();
      initLogin();
      initOtp();
      initSuccess();
      applySharedPolish();
    </script>
  </body>
</html>
