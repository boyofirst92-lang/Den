<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application complete | Maya demo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="back-button" type="button" aria-label="Back"></button>
        <button class="help-button" type="button" aria-label="Help">
          <span class="help-icon">?</span>
          <span>Help</span>
        </button>
      </header>

      <main class="main success-panel">
        <div class="success-mark">✓</div>
        <h1>You're all set.</h1>
        <p class="intro">Your loan estimate has been approved and your application has been submitted.</p>
        <div class="summary">
          <div class="row"><span>Loan amount</span><strong>P100,000</strong></div>
          <div class="row"><span>Monthly payment</span><strong>P4,333</strong></div>
          <div class="row"><span>Term</span><strong>24 months</strong></div>
        </div>
        <button class="primary" type="button">Back to home</button>
      </main>
      <p class="legal">Demo experience only. No application, credit check, or payment is submitted.</p>
      <div class="copyright">maya © 2026</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
