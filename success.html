<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application complete | Maya</title><style>body{margin:0;font:16px Arial;color:#073b2c;background:#fff}.page{max-width:540px;margin:120px auto;padding:30px;text-align:center}.mark{width:74px;height:74px;display:grid;place-items:center;margin:auto;background:#00b968;color:#fff;border-radius:50%;font-size:36px}.summary{padding:17px 18px;margin:25px 0;background:#e7f8ef;border-radius:10px;text-align:left}.row{display:flex;justify-content:space-between;margin:8px 0}.button{width:100%;padding:15px;border:0;border-radius:10px;background:#c8f169;color:#073b2c;font-weight:700}</style></head><body><main class="page"><div class="mark">✓</div><h1>You're all set.</h1><p>Your loan estimate has been approved and your application has been submitted.</p><div class="summary"><div class="row"><span>Loan amount</span><strong id="amount">P100,000</strong></div><div class="row"><span>Monthly payment</span><strong id="monthly">P4,333</strong></div><div class="row"><span>Term</span><strong id="term">24 months</strong></div></div><button class="button" onclick="location.href='application.html'">Back to home</button></main><script>const amount=+localStorage.getItem('mayaLoanAmount')||100000,months=+localStorage.getItem('mayaLoanMonths')||24,fmt=n=>'P'+Math.round(n).toLocaleString('en-PH');document.querySelector('#amount').textContent=fmt(amount);document.querySelector('#monthly').textContent=fmt(amount*(1+.04*months/12)/months);document.querySelector('#term').textContent=months+' months'</script></body></html>
