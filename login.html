<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Maya</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --panel: #eeeeee;
        --panel-alt: #f1f1f2;
        --ink: #0d1a18;
        --green: #20b96a;
        --green-deep: #0a9d60;
        --green-soft: #b8ebca;
        --muted: #8d9a92;
        --line: rgba(17, 17, 17, 0.04);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--ink);
      }

      body {
        min-height: 100vh;
      }

      .screen {
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
      }

      .shell {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 20px 22px 24px;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        margin-bottom: 14px;
      }

      .back-button {
        width: 46px;
        height: 46px;
        border: 0;
        background: transparent;
        padding: 0;
        position: relative;
        cursor: pointer;
      }

      .back-button::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 50%;
        width: 18px;
        height: 18px;
        border-left: 5px solid #1a1a1a;
        border-bottom: 5px solid #1a1a1a;
        transform: translateY(-50%) rotate(45deg);
        border-radius: 3px;
      }

      .help-button {
        border: 0;
        background: #1d1d1d;
        color: #fff;
        border-radius: 999px;
        height: 52px;
        padding: 0 18px 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 1.05rem;
        font-weight: 700;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      }

      .help-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111;
        font-size: 1.05rem;
        font-weight: 800;
        line-height: 1;
      }

      .brand-wrap {
        text-align: center;
        margin-top: 26px;
        margin-bottom: 38px;
      }

      .logo {
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.08em;
        font-size: clamp(4.2rem, 11vw, 9.7rem);
        line-height: 0.9;
        color: var(--green);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .login-form {
        width: min(100%, 425px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .field {
        width: 100%;
        background: rgba(237, 239, 238, 0.9);
        border-radius: 22px;
        border: 1px solid rgba(0, 0, 0, 0.02);
        overflow: hidden;
      }

      .phone-field {
        display: flex;
        align-items: center;
        min-height: 92px;
        padding: 0 18px 0 0;
      }

      .country-code {
        width: 88px;
        flex: 0 0 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--ink);
        font-size: clamp(1.1rem, 2.2vw, 1.7rem);
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .phone-field .input-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        min-height: 92px;
      }

      .phone-field input,
      .password-field input {
        width: 100%;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-size: clamp(1.15rem, 2.2vw, 1.7rem);
        letter-spacing: -0.04em;
      }

      .phone-field input::placeholder,
      .password-field input::placeholder {
        color: #7d8d8a;
      }

      .password-field {
        position: relative;
        min-height: 90px;
        padding: 12px 18px 12px 18px;
        display: flex;
        align-items: center;
      }

      .password-title {
        position: absolute;
        left: 18px;
        top: 12px;
        font-size: clamp(1.05rem, 2vw, 1.4rem);
        color: var(--ink);
        font-weight: 500;
        letter-spacing: -0.03em;
      }

      .password-field input {
        margin-top: 26px;
        font-size: clamp(1.15rem, 2vw, 1.8rem);
      }

      .eye {
        width: 36px;
        height: 36px;
        position: relative;
        flex: 0 0 36px;
        opacity: 0.8;
      }

      .eye::before,
      .eye::after {
        content: "";
        position: absolute;
      }

      .eye::before {
        width: 18px;
        height: 10px;
        border: 4px solid #111;
        border-top-width: 0;
        border-radius: 0 0 18px 18px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .eye::after {
        width: 8px;
        height: 8px;
        background: #111;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .forgot-link {
        margin-top: 2px;
        text-align: center;
      }

      .forgot-link a {
        color: var(--green);
        text-decoration: none;
        font-size: clamp(1.35rem, 3vw, 2.2rem);
        letter-spacing: -0.05em;
        font-weight: 500;
      }

      .login-button {
        margin-top: 96px;
        width: 100%;
        height: 88px;
        border: 0;
        border-radius: 22px;
        background: var(--green-soft);
        color: #0a4a32;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      @media (max-width: 420px) {
        .shell {
          padding-left: 16px;
          padding-right: 16px;
        }

        .login-button {
          height: 76px;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="shell">
        <header class="topbar">
          <button class="back-button" aria-label="Back"></button>
          <button class="help-button" aria-label="Help">
            <span class="help-icon">?</span>
            <span>Help</span>
          </button>
        </header>

        <div class="brand-wrap">
          <h1 class="logo">maya</h1>
        </div>

        <form class="login-form" action="#" method="post">
          <div class="field phone-field" aria-label="Phone number field">
            <div class="country-code">+63</div>
            <div class="input-wrap">
              <input type="tel" placeholder="Phone number" aria-label="Phone number" />
            </div>
          </div>

          <div class="field password-field" aria-label="Password field">
            <div class="password-title">Password</div>
            <input type="password" placeholder="Enter password" aria-label="Password" />
            <span class="eye" aria-hidden="true"></span>
          </div>

          <div class="forgot-link">
            <a href="#">Forgot your password?</a>
          </div>

          <button class="login-button" type="submit">Log in</button>
        </form>
      </div>
    </div>
  </body>
</html>
