<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Maya</title><style>body{margin:0;font:16px Arial;color:#073b2c;background:#fff}.page{max-width:430px;margin:120px auto;padding:30px}.field{display:block;margin:18px 0;font-weight:700}.field input{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:15px;border:1px solid #c8dcd3;border-radius:9px}.button{width:100%;padding:15px;border:0;border-radius:10px;background:#c8f169;color:#073b2c;font-weight:700}.back{display:block;margin-bottom:30px;color:#006f4d}</style></head><body><main class="page"><a class="back" href="details.html">← Back</a><h1>Log in to Maya</h1><form id="loginForm"><label class="field">Phone number<input id="loginPhone" type="tel" autocomplete="tel" required></label><label class="field">Password<input type="password" required></label><button class="button" type="submit">Log in</button></form></main><script>const f=document.querySelector('#loginForm'),p=document.querySelector('#loginPhone');p.value=localStorage.getItem('mayaPhone')||'';f.onsubmit=e=>{e.preventDefault();if(!f.reportValidity())return;localStorage.setItem('mayaPhone',p.value.trim());location.href='otp.html'}</script></body></html>
