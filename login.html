<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Maya</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="back-button" type="button" aria-label="Back"></button>
        <button class="help-button" type="button" aria-label="Help">
          <span class="help-icon">?</span>
          <span>Help</span>
        </button>
      </header>

      <main class="login-main">
        <div class="maya-logo">maya</div>

        <form id="loginForm" class="login-form" action="#" method="post">
          <div class="login-input" aria-label="Phone number field">
            <div class="login-phone-prefix">+63</div>
            <input id="loginPhone" type="tel" placeholder="Phone number" aria-label="Phone number" autocomplete="tel" inputmode="tel" required />
          </div>

          <div class="login-password" aria-label="Password field">
            <div class="field-label">Password</div>
            <input type="password" placeholder="Enter password" aria-label="Password" required />
            <span class="eye-icon" aria-hidden="true"></span>
          </div>

          <div class="forgot-link">
            <a href="#">Forgot your password?</a>
          </div>

          <button class="login-button" type="submit">Log in</button>
        </form>
      </main>

      <div class="copyright">maya © 2026</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
